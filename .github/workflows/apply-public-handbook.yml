name: Apply Public Handbook Direction

on:
  push:
    branches:
      - agent/grounded-public-handbook
    paths:
      - public-handbook.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/grounded-public-handbook

      - name: Ground the visual language and public copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_all(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise RuntimeError(f'Expected text not found in {path}: {old[:100]}')
                  text = text.replace(old, new)
              p.write_text(text)

          replace_all('index.html', [
              ('<meta name="theme-color" content="#0b0d12" />', '<meta name="theme-color" content="#f4f0e5" />'),
              ('<link rel="stylesheet" href="styles/manifesto.css" />', '<link rel="stylesheet" href="styles/manifesto.css" />\n  <link rel="stylesheet" href="styles/public-handbook.css" />'),
              ('A public test for the age of AI and AGI: does technological progress give every child a genuine path to security, knowledge, agency and the power to improve their world?', 'A simple question for a complicated age: does progress give every child a real chance to learn, make things, feel secure and improve the world around them?'),
              ('<small>Six years old · Kazakhstan</small>', '<small>Six years old · somewhere in the world</small>'),
              ('When a six-year-old asks an intelligent machine how to change the world, the answer must open a <em>real path to capability</em>, not an advert, a privilege gate or a comforting lie.', 'When a six-year-old asks how to change the world, the answer should open a <em>real path forward</em>, not an advert, a locked door or a comforting lie.'),
              ('The test is deliberately unforgiving. It asks whether progress is changing the practical options available to an ordinary child, wherever they were born. Better benchmarks and larger fortunes do not count unless they become broader human capability.', 'The Test asks what a child could actually do with the best knowledge available today. Faster machines and larger fortunes only count when they create more choices for ordinary people.'),
              ('<div class="kicker">The pillars</div>\n            <h2>What must remain true.</h2>', '<div class="kicker">What we believe</div>\n            <h2>Progress should widen people’s choices.</h2>'),
              ('This is not a promise that AGI will save us. It is a set of conditions under which advanced intelligence might help create abundance without creating a shinier form of feudalism.', 'This is not a promise that technology will save us. It is a set of practical rules for judging whether new tools are making life safer, fairer and more useful.'),
              ('Capability before consumption', 'Help people do more'),
              ('Abundance must be distributed', 'Share what progress creates'),
              ('Public investment, public capability', 'Public money should create public benefit'),
              ('Evidence over ideology', 'Show the evidence'),
              ('Transition is infrastructure', 'Help people through change'),
              ('Open, but not reckless', 'Open where safe'),
              ('No geography lottery', 'No birthplace lottery'),
              ('Humans retain authorship', 'People choose the direction'),
              ('<div class="kicker">Transition architecture</div>\n            <h2>Survive the bridge.</h2>', '<div class="kicker">Getting from here to there</div>\n            <h2>The future only matters if people can reach it.</h2>'),
              ('The danger is not only what AI becomes. It is the mismatch between the speed of technical change and the speed of energy systems, institutions, income distribution and democratic consent.', 'Technology can change much faster than wages, public services, energy systems and democratic decisions. We need to build the crossing before asking people to walk across it.'),
              ('The enabling curve', 'Make useful things cheaper'),
              ('The danger curve', 'Watch what could break'),
              ('The distribution curve', 'Make sure the gains reach people'),
              ('<div class="kicker">The first institution</div>\n            <h2>Build the Common Foundry.</h2>', '<div class="kicker">A practical proposal</div>\n            <h2>Imagine if scientific progress belonged to everyone.</h2>'),
              ('A treaty-backed, globally distributed network where AI, scientists and robotic laboratories can move from hypothesis to independently replicated physical technology in the public interest.', 'The Common Foundry would be a shared network of scientists, automated laboratories and workshops, working on public problems and publishing what they learn for everyone to use.'),
              ('Not one mega-lab. One shared machine for discovery.', 'Not one giant laboratory. A shared workshop for discovery.'),
              ('<div class="kicker">Evidence ledger</div>\n            <h2>The future has prototypes.</h2>', '<div class="kicker">What is already real</div>\n            <h2>Pieces of this future already exist.</h2>'),
              ('These are not proof that abundance is inevitable. They show that pieces of the proposed loop already work. Snapshot dated 16 July 2026.', 'None of these examples proves that everything will work. They show that important pieces already do. Evidence checked on 16 July 2026.'),
              ('<div class="kicker">The public scoreboard</div>\n          <h3>Measure civilisation, not hype.</h3>', '<div class="kicker">How we keep ourselves honest</div>\n          <h3>Measure what changes for people.</h3>'),
              ('Every claim should eventually connect to a public indicator. The categories below are the scaffold for the next build, not invented scores.', 'Every claim should connect to something we can inspect. These questions guide the Test without pretending that missing evidence is a number.'),
              ('<small>Capability</small>', '<small>Can people do more?</small>'),
              ('<small>Security</small>', '<small>Is everyday life safer?</small>'),
              ('<small>Access</small>', '<small>Who gets to use the tools?</small>'),
              ('<small>Distribution</small>', '<small>Who receives the gains?</small>'),
              ('<small>Physical efficiency</small>', '<small>Do we waste less?</small>'),
              ('<small>Scientific velocity</small>', '<small>Can good ideas become real?</small>'),
              ('<small>Resilience</small>', '<small>Can systems survive shocks?</small>'),
              ('<small>Agency</small>', '<small>Can people shape decisions?</small>')
          ])

          replace_all('test.html', [
              ('<meta name="theme-color" content="#0b0d12" />', '<meta name="theme-color" content="#f4f0e5" />'),
              ('<link rel="stylesheet" href="styles/test.css" />', '<link rel="stylesheet" href="styles/test.css" />\n  <link rel="stylesheet" href="styles/public-handbook.css" />'),
              ('Measuring whether today\'s world can turn advanced intelligence into real capability for an ordinary child.', 'Asking whether a child can turn the best available knowledge into a real next step.'),
              ('Inspect the method', 'See how it works'),
              ('Official research completed', 'Evidence checked'),
              ('Measured substrate', 'What the world makes possible'),
              ('Five measured or proxy dimensions. Three critical dimensions remain unknown.', 'Five parts can be estimated today. Three important parts still cannot.'),
              ('Evidence / official runs', 'Confidence / runs'),
              ('Critical unknowns', 'Still unmeasured'),
              ('Safe child AI path', 'Safe route for a child'),
              ('<div class="kicker">The capability wheel</div>\n            <h2>Where the pathway holds. Where it breaks.</h2>', '<div class="kicker">What the world makes possible</div>\n            <h2>Where a child can move forward, and where they get stuck.</h2>'),
              ('The score measures enabling conditions, not the probability that a child succeeds. Unknown critical dimensions remain unknown and force the overall verdict to fail.', 'The score describes the conditions around a child. It does not predict their future. Important gaps stay unmeasured, and those gaps mean the world cannot pass.'),
              ('<div class="kicker">The pathway checkpoints</div>\n            <h2>Intelligence is lost between signal and agency.</h2>', '<div class="kicker">The route from an answer to action</div>\n            <h2>Knowing what to do is not the same as being able to do it.</h2>'),
              ('These are standalone indicators, not one cohort. They deliberately expose the weak links without multiplying incompatible populations into a fictional funnel.', 'These figures describe different groups, years and places. They sit beside one another to show the weak points. They are not one child’s journey.'),
              ('The strongest findings are rendered from fixed evidence fields. Future research runs may update the numbers, but they do not redesign the report.', 'These findings come from the published evidence. Later runs may change the figures, while keeping the same questions and rules.'),
              ('<div class="kicker">The first gate</div>', '<div class="kicker">The first locked door</div>'),
              ('The world may fail before the answer begins.', 'A child may be blocked before they can even ask.'),
              ('A pass does not require an unsupervised six-year-old to operate an unrestricted chatbot. It requires a safe, dependable and globally available route through a trusted adult or institution. The sampled leading consumer assistants do not yet provide one consistently.', 'A pass does not mean handing an unrestricted chatbot to a six-year-old. It means providing a safe and dependable route through a trusted adult, school, library or public service. That route is not available everywhere today.'),
              ('Safe child-appropriate AI path', 'Safe route to useful help'),
              ('<div class="kicker">Known unknowns</div>\n            <h2>The missing measures are part of the result.</h2>', '<div class="kicker">What we still cannot measure</div>\n            <h2>The gaps are part of the answer.</h2>'),
              ('A dashboard that hides uncertainty becomes propaganda with rounded corners. These gaps prevent an official pass and define the next research work.', 'Hiding uncertainty would make the result look neater and make it less honest. These gaps prevent a pass and show us what needs measuring next.'),
              ('<div class="kicker">Methodology</div>\n            <h2>The AI researches. The code measures.</h2>', '<div class="kicker">How the Test stays honest</div>\n            <h2>Research finds the evidence. Fixed rules produce the result.</h2>'),
              ('The metric definitions, weights, scoring rules and infographic are fixed in the site. A quarterly research run may update evidence only. Missing values stay missing, raw counts are not scored without matching denominators, and publication dates are never mistaken for observation dates.', 'The questions, weights and scoring rules are fixed. A later run may update the evidence, but it cannot quietly rewrite the Test. Missing figures remain missing, and every published result needs human approval.'),
              ('Approved primary sources only', 'Use dependable original sources'),
              ('Strict structured evidence payload', 'Return evidence in a fixed format'),
              ('Deterministic scoring in code', 'Use the same scoring rules every time'),
              ('Human approval before publication', 'A person checks every result'),
              ('Evidence ledger and source notes', 'Evidence and source notes'),
              ('<div class="kicker">Official Run 1 complete</div>\n        <h2>Now we build the bridge we cannot yet measure.</h2>', '<div class="kicker">Official Run 1</div>\n        <h2>The result is a starting point, not a verdict on the future.</h2>'),
              ('Official Run 1 establishes the first defensible world snapshot and a deliberately small scheduled payload. Future accepted runs can update the evidence without redesigning the Test.', 'Run 1 gives us an honest first picture. Future runs can update the evidence and show whether the world is becoming easier for a child to navigate.')
          ])

          Path('docs/public-handbook-direction.md').write_text('''# Public Handbook direction\n\n## Design intent\n\nThe Six-Year-Old Manifesto should feel like a calm public handbook: welcoming, practical, curious and honest. The child is the protagonist. Technology is one of the tools around them.\n\n## Principles\n\n1. Invite rather than impress.\n2. Use ordinary language before specialist language.\n3. Keep evidence visible and uncertainty explicit.\n4. Use warm paper, ink and restrained functional colour.\n5. Avoid technological theatre, corporate jargon and claims larger than the evidence.\n6. Never attach the imagined child to a country unless geography is materially relevant to evidence.\n\n## Public language\n\n- Measured Enabling Substrate: What the world makes possible\n- Institutional bridging: Help beyond the answer\n- Practical pathway quality: Could a child actually do this?\n- Agency and participation: Can people take part and shape decisions?\n- Known unknowns: What we still cannot measure\n- Evidence confidence: How sure are we?\n\nTechnical identifiers remain unchanged in data and methodology.\n\n## Colour roles\n\n- Paper: background and calm reading space\n- Charcoal: primary text and serious calls to action\n- Blue: evidence and explanation\n- Green: progress and available routes\n- Amber: caution and uncertainty\n- Muted red: failure or serious concern\n''')
          PY

          rm -f public-handbook.ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ground the Manifesto in the Public Handbook direction"
          git push
