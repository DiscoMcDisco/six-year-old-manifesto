  version: 1

project:
  repository: DiscoMcDisco/six-year-old-manifesto
  status: active
  profile: static-site

capabilities:
  add: [vercel, github-actions]
  remove: []

providers:
  vercel: true
  github_actions: true
  database: false
  external_api: false

exceptions: []

notes:
